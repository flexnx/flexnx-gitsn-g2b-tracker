name: collect
on:
  schedule:
    - cron: "17 22 * * *"   # 매일 07:17 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "probe 또는 collect"
        default: "collect"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collector/collect.py ${{ github.event.inputs.mode || 'collect' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json public/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
